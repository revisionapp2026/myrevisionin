<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — REVISION</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#062B8F" />
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f9fd;
        color: #102a63;
        padding: 24px;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e7f0;
        border-radius: 14px;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 6px 18px rgba(16, 42, 99, 0.06);
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 20px;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        color: #687386;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        background: #f56b00;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        padding: 11px 20px;
        border-radius: 10px;
      }
      .mark {
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #062b8f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">REVISION</div>
      <h1>You're offline</h1>
      <p>
        This page needs an internet connection. Pages you opened earlier are still available — check
        your connection and try again.
      </p>
      <a href="/dashboard">Try again</a>
    </div>
  </body>
</html>
